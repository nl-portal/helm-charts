{{- $keycloak_version := required "You must set settings.keycloak.version" .Values.settings.keycloak.version -}}

{{- /* Keycloaks <17.0.0 use the /auth prefix. */ -}}
{{- /* Keycloaks >=17.0.0 use no prefix, but do make this configurable */ -}}
{{- /* So we default to no prefix, but allow the user to overwrite this */ -}}
{{- $keycloak_http_relative_path := "" -}}
{{- if (semverCompare "<17.0.0" (default "0" $keycloak_version)) -}}
{{- $keycloak_http_relative_path = "/auth" -}}
{{- else if .Values.settings.keycloak.httpRelativePath -}}
{{- $keycloak_http_relative_path = .Values.settings.keycloak.httpRelativePath -}}
{{- end -}}

{{- $token_exchange_version := .Values.settings.keycloak.tokenExchangeVersion | default "v1" -}}
{{- if not (has $token_exchange_version (list "v1" "v2")) -}}
{{- fail (printf "settings.keycloak.tokenExchangeVersion must be either \"v1\" or \"v2\", got %q" $token_exchange_version) -}}
{{- end -}}

{{- /* Standard token exchange needs NL Portal 3.1.0 or newer. */ -}}
{{- /* A user supplied tag such as a digest or "latest" cannot be checked and is left alone. */ -}}
{{- /* An unparseable chart appVersion is a chart defect, so that does not pass silently. */ -}}
{{- if eq $token_exchange_version "v2" -}}
{{- $app_version := .Values.image.tag | default .Chart.AppVersion | toString -}}
{{- $app_version_core := regexFind `^[0-9]+\.[0-9]+\.[0-9]+` $app_version -}}
{{- if $app_version_core -}}
{{- if not (semverCompare ">=3.1.0" $app_version_core) -}}
{{- fail (printf "settings.keycloak.tokenExchangeVersion \"v2\" requires NL Portal 3.1.0 or newer, but the deployed version is %s" $app_version) -}}
{{- end -}}
{{- else if not .Values.image.tag -}}
{{- fail (printf "Chart appVersion %q is not a semantic version, so the NL Portal version cannot be checked against the 3.1.0 minimum that settings.keycloak.tokenExchangeVersion \"v2\" requires. Set image.tag to the version you deploy." $app_version) -}}
{{- end -}}
{{- end -}}

{{- include "nl-portal-backend.validateRemovedValues" . -}}
{{- include "nl-portal-backend.validateModuleDependencies" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nl-portal-backend.fullname" . }}
  labels:
    {{- include "nl-portal-backend.labels" . | nindent 4 }}
data:
  LOGLEVEL: {{ .Values.settings.app.logLevel | quote }}
  DATABASE_URL: {{ required "You must set settings.database.url" .Values.settings.database.url | quote }}
  DATABASE_USERNAME: {{ .Values.settings.database.username | quote }}
  JWKS_URI: {{ printf "%s%s/realms/%s/protocol/openid-connect/certs" .Values.settings.keycloak.url $keycloak_http_relative_path .Values.settings.keycloak.realm | quote }}
  KEYCLOAK_CLIENT_ID: {{ required "You must set settings.keycloak.clientID" .Values.settings.keycloak.clientID | quote }}
  KEYCLOAK_TOKEN_EXCHANGE_VERSION: {{ $token_exchange_version | quote }}
{{- if eq $token_exchange_version "v1" }}
  KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE: {{ required "You must set settings.keycloak.audience when settings.keycloak.tokenExchangeVersion is \"v1\"" .Values.settings.keycloak.audience | quote }}
{{- else if .Values.settings.keycloak.audience }}
  KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE: {{ .Values.settings.keycloak.audience | quote }}
{{- end }}
{{- if .Values.settings.keycloak.acceptedAudiences }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: {{ .Values.settings.keycloak.acceptedAudiences | quote }}
{{- end }}
  OIDC_REALM: {{ .Values.settings.keycloak.realm | quote }}

{{- /* Any cors[0] key replaces NL Portal's whole default CORS list, so render nothing unless a path is set. */ -}}
{{- with .Values.settings.app.security.cors }}
{{- if .path }}
  NLPORTAL_SECURITY_CORS_0_PATH: {{ .path | quote }}
{{- with .config.allowedHeaders }}
  NLPORTAL_SECURITY_CORS_0_CONFIG_ALLOWEDHEADERS: {{ . | quote }}
{{- end }}
{{- with .config.allowedOrigins }}
  NLPORTAL_SECURITY_CORS_0_CONFIG_ALLOWEDORIGINS: {{ . | quote }}
{{- end }}
{{- with .config.allowedMethods }}
  NLPORTAL_SECURITY_CORS_0_CONFIG_ALLOWEDMETHODS: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.settings.app.security.endpoints.unsecured }}
  NLPORTAL_SECURITY_ENDPOINTS_UNSECURED: {{ . | quote }}
{{- end }}

  CONFIGURATION_PANEL_ENABLED: {{ .Values.settings.app.features.configurationPanel.enabled | quote }}
  CONFIGURATION_PANEL_URI: {{ .Values.settings.app.features.configurationPanel.uri | quote }}
  CONFIGURATION_PANEL_APPLICATION_NAME: {{ .Values.settings.app.features.configurationPanel.applicationName | quote }}

  NLPORTAL_SUPPORT_PINGENDPOINT_ENABLED: {{ .Values.settings.app.support.pingEndpoint.enabled | quote }}

  # Authentication
  NLPORTAL_AUTHENTICATION_MACHTINGSDIENST_RESOURCEURL: {{ .Values.settings.services.authentication.machtingsdienst.resourceUrl | quote }}
  NLPORTAL_AUTHENTICATION_MACHTINGSDIENST_ALLMACHTIGINGUUID: {{ .Values.settings.services.authentication.machtingsdienst.allMachtigingUuid | quote }}

  # BesluitenAPI
  NLPORTAL_CONFIG_BESLUITENAPI_ENABLED: {{ .Values.settings.services.besluitenapi.enabled | quote }}
  NLPORTAL_CONFIG_BESLUITENAPI_PROPERTIES_URL: {{ .Values.settings.services.besluitenapi.properties.url | quote }}
  NLPORTAL_CONFIG_BESLUITENAPI_PROPERTIES_CLIENTID: {{ .Values.settings.services.besluitenapi.properties.clientId | quote }}

  # CatalogiAPI
  NLPORTAL_CONFIG_CATALOGIAPI_ENABLED: {{ .Values.settings.services.catalogiapi.enabled | quote }}
  NLPORTAL_CONFIG_CATALOGIAPI_PROPERTIES_URL: {{ .Values.settings.services.catalogiapi.properties.url | quote }}
  NLPORTAL_CONFIG_CATALOGIAPI_PROPERTIES_CLIENTID: {{ .Values.settings.services.catalogiapi.properties.clientId | quote }}

  # DocumentenAPIs
  NLPORTAL_CONFIG_DOCUMENTENAPIS_ENABLED: {{ .Values.settings.services.documentenapis.enabled | quote }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_DEFAULTDOCUMENTAPI: {{ .Values.settings.services.documentenapis.properties.defaultDocumentApi | quote }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_ALLOWEDMIMETYPES: {{ .Values.settings.services.documentenapis.properties.allowedMimeTypes | quote }}
{{- with .Values.settings.services.documentenapis.properties.vertrouwelijkheidsaanduidingWhitelist }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_VERTROUWELIJKHEIDSAANDUIDINGWHITELIST: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.documentenapis.properties.statusWhitelist }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_STATUSWHITELIST: {{ . | quote }}
{{- end }}
{{- /* A configuration with an empty url matches every document URL, so each one renders only when its url is set. */ -}}
{{- with .Values.settings.services.documentenapis.properties.configurations.openzaak }}
{{- if .url }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_OPENZAAK_URL: {{ .url | quote }}
{{- with .clientId }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_OPENZAAK_CLIENTID: {{ . | quote }}
{{- end }}
{{- with .rsin }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_OPENZAAK_RSIN: {{ . | quote }}
{{- end }}
{{- with .documentTypeUrl }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_OPENZAAK_DOCUMENTTYPEURL: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.settings.services.documentenapis.properties.configurations.dummydoc }}
{{- if .url }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_DUMMYDOC_URL: {{ .url | quote }}
{{- with .clientId }}
  NLPORTAL_CONFIG_DOCUMENTENAPIS_PROPERTIES_CONFIGURATIONS_DUMMYDOC_CLIENTID: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}

  # VirusScan ClamAV
  NLPORTAL_CONFIG_VIRUSSCAN_CLAMAV_ENABLED: {{ .Values.settings.services.virusscan.clamav.enabled | quote }}
  NLPORTAL_CONFIG_VIRUSSCAN_CLAMAV_PROPERTIES_HOSTNAME: {{ .Values.settings.services.virusscan.clamav.properties.hostname | quote }}
  NLPORTAL_CONFIG_VIRUSSCAN_CLAMAV_PROPERTIES_PORT: {{ .Values.settings.services.virusscan.clamav.properties.port | quote }}

  # ZakenAPI
  NLPORTAL_CONFIG_ZAKENAPI_ENABLED: {{ .Values.settings.services.zakenapi.enabled | quote }}
  NLPORTAL_CONFIG_ZAKENAPI_PROPERTIES_URL: {{ .Values.settings.services.zakenapi.properties.url | quote }}
  NLPORTAL_CONFIG_ZAKENAPI_PROPERTIES_CLIENTID: {{ .Values.settings.services.zakenapi.properties.clientId | quote }}
  NLPORTAL_CONFIG_ZAKENAPI_PROPERTIES_ZAAKTYPESIDSEXCLUDED: {{ .Values.settings.services.zakenapi.properties.zaakTypesIdsExcluded | quote }}
  NLPORTAL_CONFIG_ZAKENAPI_PROPERTIES_USENNPKVKQUERYIDENTIFICATORS: {{ .Values.settings.services.zakenapi.properties.useNnpKvkQueryIdentificators | quote }}

  # ObjectenAPI
  NLPORTAL_CONFIG_OBJECTENAPI_ENABLED: {{ .Values.settings.services.objectenapi.enabled | quote }}
  NLPORTAL_CONFIG_OBJECTENAPI_PROPERTIES_URL: {{ .Values.settings.services.objectenapi.properties.url | quote }}

  # OpenKlant2
  NLPORTAL_CONFIG_OPENKLANT2_ENABLED: {{ .Values.settings.services.openklant2.enabled | quote }}
  NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_KLANTINTERACTIESAPIURL: {{ .Values.settings.services.openklant2.properties.klantinteractiesApiUrl | quote }}
  NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_CONTACTGEGEVENSAPIURL: {{ .Values.settings.services.openklant2.properties.contactgegevensApiUrl | quote }}
{{- with .Values.settings.services.openklant2.properties.digitalAdressenReferentie }}
  NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_DIGITALADRESSENREFERENTIE: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.openklant2.properties.klantContactCodeRegister.zaak }}
  NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_KLANTCONTACTCODEREGISTER_ZAAK: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.openklant2.properties.klantContactCodeRegister.product }}
  NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_KLANTCONTACTCODEREGISTER_PRODUCT: {{ . | quote }}
{{- end }}

  # OpenProduct
  NLPORTAL_CONFIG_OPENPRODUCT_ENABLED: {{ .Values.settings.services.openproduct.enabled | quote }}
  NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_PRODUCTAPIURL: {{ .Values.settings.services.openproduct.properties.productApiUrl | quote }}
  NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_PRODUCTTYPEAPIURL: {{ .Values.settings.services.openproduct.properties.productTypeApiUrl | quote }}
  NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_DMN_CLIENTID: {{ .Values.settings.services.openproduct.properties.dmn.clientId | quote }}
  NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_DMN_USERNAME: {{ .Values.settings.services.openproduct.properties.dmn.username | quote }}

  # HaalCentraal2
  NLPORTAL_CONFIG_HAALCENTRAAL2_ENABLED: {{ .Values.settings.services.haalcentraal2.enabled | quote }}
  NLPORTAL_CONFIG_HAALCENTRAAL2_PROPERTIES_BRPAPIURL: {{ .Values.settings.services.haalcentraal2.properties.brpApiUrl | quote }}
  NLPORTAL_CONFIG_HAALCENTRAAL2_PROPERTIES_BEWONINGAPIURL: {{ .Values.settings.services.haalcentraal2.properties.bewoningApiUrl | quote }}
{{- with .Values.settings.services.haalcentraal2.properties.brpFields }}
  NLPORTAL_CONFIG_HAALCENTRAAL2_PROPERTIES_BRPFIELDS: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.haalcentraal2.properties.allowedCitiesForBewoning }}
  NLPORTAL_CONFIG_HAALCENTRAAL2_PROPERTIES_ALLOWEDCITIESFORBEWONING: {{ . | quote }}
{{- end }}

  # HaalCentraal HR
  NLPORTAL_CONFIG_HAALCENTRAAL_HR_ENABLED: {{ .Values.settings.services.haalcentraalHr.enabled | quote }}
  # NL Portal 4.0.0 reads this key for the gemachtigde query and the frontend module list.
  NLPORTAL_CONFIG_HAALCENTRAALHR_ENABLED: {{ .Values.settings.services.haalcentraalHr.enabled | quote }}
  NLPORTAL_CONFIG_HAALCENTRAAL_HR_PROPERTIES_URL: {{ .Values.settings.services.haalcentraalHr.properties.url | quote }}
{{- with .Values.settings.services.haalcentraalHr.properties.ssl.key.certChain }}
  NLPORTAL_CONFIG_HAALCENTRAAL_HR_PROPERTIES_SSL_KEY_CERTCHAIN: {{ . | quote }}
{{- end }}

  # Taak
  NLPORTAL_CONFIG_TAAK_ENABLED: {{ .Values.settings.services.taak.enabled | quote }}
  NLPORTAL_CONFIG_TAAK_PROPERTIES_OBJECTTYPEURL: {{ .Values.settings.services.taak.properties.objectTypeUrl | quote }}

  # Berichten
  NLPORTAL_CONFIG_BERICHTEN_ENABLED: {{ .Values.settings.services.berichten.enabled | quote }}
  NLPORTAL_CONFIG_BERICHTEN_PROPERTIES_BERICHTOBJECTTYPEURL: {{ .Values.settings.services.berichten.properties.berichtObjectTypeUrl | quote }}

  # Verificatie
  NLPORTAL_CONFIG_VERIFICATIE_ENABLED: {{ .Values.settings.services.verificatie.enabled | quote }}
{{- if .Values.settings.services.verificatie.enabled }}
  NLPORTAL_CONFIG_VERIFICATIE_PROPERTIES_URL: {{ required "You must set settings.services.verificatie.properties.url when settings.services.verificatie.enabled is true" .Values.settings.services.verificatie.properties.url | quote }}
{{- end }}
{{- with .Values.settings.services.verificatie.properties.clientId }}
  NLPORTAL_CONFIG_VERIFICATIE_PROPERTIES_CLIENTID: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.verificatie.properties.templateIdPhoneNumber }}
  NLPORTAL_CONFIG_VERIFICATIE_PROPERTIES_TEMPLATEIDPHONENUMBER: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.verificatie.properties.templateIdEmail }}
  NLPORTAL_CONFIG_VERIFICATIE_PROPERTIES_TEMPLATEIDEMAIL: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.verificatie.properties.typesNeedVerification }}
  NLPORTAL_CONFIG_VERIFICATIE_PROPERTIES_TYPESNEEDVERIFICATION: {{ . | quote }}
{{- end }}

  # Product
  NLPORTAL_CONFIG_PRODUCT_ENABLED: {{ .Values.settings.services.product.enabled | quote }}
  NLPORTAL_CONFIG_PRODUCT_PROPERTIES_PRODUCTTYPEURL: {{ .Values.settings.services.product.properties.productTypeUrl | quote }}
  NLPORTAL_CONFIG_PRODUCT_PROPERTIES_PRODUCTINSTANTIETYPEURL: {{ .Values.settings.services.product.properties.productInstantieTypeUrl | quote }}
  NLPORTAL_CONFIG_PRODUCT_PROPERTIES_PRODUCTDETAILSTYPEURL: {{ .Values.settings.services.product.properties.productDetailsTypeUrl | quote }}
  NLPORTAL_CONFIG_PRODUCT_PROPERTIES_PRODUCTVERBRUIKSOBJECTTYPEURL: {{ .Values.settings.services.product.properties.productVerbruiksObjectTypeUrl | quote }}

  # DMN
  NLPORTAL_CONFIG_DMN_ENABLED: {{ .Values.settings.services.dmn.enabled | quote }}
  NLPORTAL_CONFIG_DMN_PROPERTIES_URL: {{ .Values.settings.services.dmn.properties.url | quote }}
  NLPORTAL_CONFIG_DMN_PROPERTIES_CLIENTID: {{ .Values.settings.services.dmn.properties.clientId | quote }}
  NLPORTAL_CONFIG_DMN_PROPERTIES_USERNAME: {{ .Values.settings.services.dmn.properties.username | quote }}

  # Prefill
  NLPORTAL_CONFIG_PREFILL_ENABLED: {{ .Values.settings.services.prefill.enabled | quote }}
  NLPORTAL_CONFIG_PREFILL_PROPERTIES_TYPEURL: {{ .Values.settings.services.prefill.properties.typeUrl | quote }}
  NLPORTAL_CONFIG_PREFILL_PROPERTIES_PREFILLSHAVERSION: {{ .Values.settings.services.prefill.properties.prefillShaVersion | quote }}

  # Frontend (served by GET /api/public/frontend)
{{- range $name, $value := .Values.settings.frontend.toggles }}
{{- if not (kindIs "invalid" $value) }}
  NLPORTAL_FRONTEND_TOGGLES_{{ upper $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- range $name, $value := .Values.settings.frontend.properties }}
{{- if not (kindIs "invalid" $value) }}
{{- /* YAML numbers arrive as float64, which large values would render as 1e+07. */ -}}
{{- if and (kindIs "float64" $value) (eq $value (floor $value)) }}
{{- $value = int64 $value }}
{{- end }}
  NLPORTAL_FRONTEND_PROPERTIES_{{ upper $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- with .Values.settings.frontend.theme.logo }}
  NLPORTAL_FRONTEND_THEME_LOGO: {{ . | quote }}
{{- end }}
{{- with .Values.settings.frontend.theme.style }}
  NLPORTAL_FRONTEND_THEME_STYLE: {{ . | quote }}
{{- end }}
{{- with .Values.settings.frontend.modulesWhitelist }}
  NLPORTAL_FRONTEND_MODULESWHITELIST: {{ . | quote }}
{{- end }}

  # Payment Direct
  NLPORTAL_CONFIG_PAYMENT_DIRECT_ENABLED: {{ .Values.settings.services.payment.direct.enabled | quote }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_URL: {{ .Values.settings.services.payment.direct.properties.url | quote }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_SHAOUTPARAMETERS: {{ .Values.settings.services.payment.direct.properties.shaOutParameters | quote }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_WEBHOOKHEADERS: {{ .Values.settings.services.payment.direct.properties.webhookHeaders | quote }}
{{- with .Values.settings.services.payment.direct.properties.webhookUrl }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_WEBHOOKURL: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.payment.direct.properties.customTemplateUrl }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CUSTOMTEMPLATEURL: {{ . | quote }}
{{- end }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_SHOWRESULTPAGE: {{ .Values.settings.services.payment.direct.properties.showResultPage | quote }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_PSPID: {{ .Values.settings.services.payment.direct.properties.configurations.belastingzaken.pspId | quote }}
{{- with .Values.settings.services.payment.direct.properties.configurations.belastingzaken.language }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_LANGUAGE: {{ . | quote }}
{{- end }}
{{- with .Values.settings.services.payment.direct.properties.configurations.belastingzaken.currency }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_CURRENCY: {{ . | quote }}
{{- end }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_RETURNURL: {{ .Values.settings.services.payment.direct.properties.configurations.belastingzaken.returnUrl | quote }}
{{- if not (kindIs "invalid" .Values.settings.services.payment.direct.properties.configurations.belastingzaken.creditcardEnabled) }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_CREDITCARDENABLED: {{ .Values.settings.services.payment.direct.properties.configurations.belastingzaken.creditcardEnabled | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.settings.services.payment.direct.properties.configurations.belastingzaken.allowedNumberOfPayments) }}
  NLPORTAL_CONFIG_PAYMENT_DIRECT_PROPERTIES_CONFIGURATIONS_BELASTINGZAKEN_ALLOWEDNUMBEROFPAYMENTS: {{ .Values.settings.services.payment.direct.properties.configurations.belastingzaken.allowedNumberOfPayments | quote }}
{{- end }}
