{{- if and (not .Values.existingSecret) (not .Values.secretEnvVars) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nl-portal-configpanel-backend.fullname" . }}
  labels:
    {{- include "nl-portal-configpanel-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USERNAME: {{ .Values.settings.database.username | quote }}
  DATABASE_PASSWORD: {{ .Values.settings.database.password | quote }}
  CONFIG_SERVER_TOKEN: {{ .Values.settings.app.serverToken | quote }}
{{- /* toString: "false" as a string is truthy in a template */ -}}
{{- if eq (toString .Values.settings.app.encryption.enabled) "true" }}
  CONFIG_ENCRYPTION_KEY: {{ required "settings.app.encryption.key is required when encryption is enabled" .Values.settings.app.encryption.key | quote }}
{{- end }}
{{- if eq (toString .Values.settings.app.notifyEnabled) "true" }}
  CONFIG_NOTIFY_CLIENT_SECRET: {{ required "settings.app.notify.client.clientSecret is required when notifyEnabled" .Values.settings.app.notify.client.clientSecret | quote }}
{{- end }}
{{- end }}
